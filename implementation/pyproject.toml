[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-research"
version = "0.1.0"
description = "Phase 1 live object measurement and later-phase implementation"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
data = ["pyarrow==25.0.1", "python-dateutil==2.9.0.post0"]
research = ["numpy==2.3.3"]

[tool.setuptools.packages.find]
where = ["src"]
