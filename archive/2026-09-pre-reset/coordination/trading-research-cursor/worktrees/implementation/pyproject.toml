[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-research"
version = "0.1.0"
description = "Causal reference implementation and evidence ledger for the B00–B10 research program"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
data = ["pyarrow==25.0.1", "databento-dbn==0.69.0"]
research = ["numpy==2.3.3", "scipy==1.16.2", "scikit-learn==1.7.2", "threadpoolctl==3.6.0", "joblib==1.5.2"]

[tool.setuptools.packages.find]
where = ["src"]
